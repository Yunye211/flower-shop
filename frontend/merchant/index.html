<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲜花商城 · 商家端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; background: #f6f7fb; color: #333; }
  header { background: linear-gradient(135deg,#4facfe,#00f2fe); color: #fff; padding: 14px 24px;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 20px; }
  nav { display: flex; gap: 4px; background: #fff; padding: 0 24px; border-bottom: 1px solid #eee; }
  nav button { border: none; background: none; padding: 12px 16px; cursor: pointer; color: #666; font-size: 15px; }
  nav button.active { color: #4facfe; border-bottom: 3px solid #4facfe; font-weight: 600; }
  main { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 16px; }
  .hide { display: none !important; }
  input, textarea, select, button { font: inherit; }
  .btn { border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #4facfe; color: #fff; }
  .btn-ghost { background: #f1f2f6; color: #555; }
  .btn-danger { background: #ff4d4f; color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 13px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=text],input[type=password],input[type=number],textarea { border: 1px solid #ddd; border-radius: 6px;
    padding: 8px 10px; width: 220px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; text-align: left; font-size: 14px; }
  th { color: #888; font-weight: 500; background: #fafafa; }
  .login-box { max-width: 380px; margin: 60px auto; }
  .login-box .card { padding: 30px; }
  .login-box h2 { margin-bottom: 18px; text-align: center; }
  .login-box .row { margin-bottom: 14px; }
  .login-box input { width: 100%; }
  .msg { color: #666; font-size: 13px; margin-top: 10px; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333;
    color: #fff; padding: 10px 20px; border-radius: 6px; z-index: 999; font-size: 14px; display: none; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag-green { background: #e6fffb; color: #08979c; }
  .tag-orange { background: #fff7e6; color: #d46b08; }
  .tag-red { background: #fff1f0; color: #cf1322; }
  .tag-gray { background: #f0f0f0; color: #666; }
</style>
</head>
<body>
<header>
  <h1>🏪 鲜花商城 · 商家端</h1>
  <div id="userBar"></div>
</header>
<nav id="navBar" class="hide">
  <button class="active" data-tab="products">商品管理</button>
  <button data-tab="orders">订单管理</button>
</nav>
<div class="toast" id="toast"></div>

<!-- 登录 -->
<div class="login-box" id="loginView">
  <div class="card">
    <h2>商家登录</h2>
    <div class="row"><input id="lgUser" placeholder="商家用户名" type="text"></div>
    <div class="row"><input id="lgPwd" placeholder="密码" type="password"></div>
    <div class="row"><button class="btn btn-primary" style="width:100%" onclick="login()">登 录</button></div>
    <div class="row"><button class="btn btn-ghost" style="width:100%" onclick="showReg()">注册店铺</button></div>
    <p class="msg">演示账号 shop01 / shop123</p>
  </div>
</div>
<div class="login-box hide" id="regView">
  <div class="card">
    <h2>商家注册</h2>
    <div class="row"><input id="rgUser" placeholder="用户名" type="text"></div>
    <div class="row"><input id="rgPwd" placeholder="密码(≥8位含字母数字)" type="password"></div>
    <div class="row"><input id="rgShop" placeholder="店铺名称" type="text"></div>
    <div class="row"><input id="rgPhone" placeholder="手机号(选填)" type="text"></div>
    <div class="row"><button class="btn btn-primary" style="width:100%" onclick="doReg()">注 册</button></div>
    <div class="row"><button class="btn btn-ghost" style="width:100%" onclick="showLogin()">返回登录</button></div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainView" class="hide">
  <section id="tab-products">
    <div class="card">
      <h3 style="margin-bottom:12px">➕ 上架新商品</h3>
      <div class="row" style="margin-bottom:10px">
        <input id="pName" placeholder="商品名称">
        <input id="pPrice" type="number" step="0.01" min="0" placeholder="价格(元)">
        <input id="pStock" type="number" min="0" value="10" placeholder="库存">
        <button class="btn btn-primary" onclick="addProduct()">上架</button>
      </div>
      <div class="row"><input id="pImg" style="width:360px" placeholder="图片URL(选填)"><textarea id="pDesc" style="width:360px" placeholder="商品描述(选填)"></textarea></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">📦 我的商品（点击按钮可修改/上下架）</h3>
      <table>
        <thead><tr><th>ID</th><th>名称</th><th>价格</th><th>库存</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="prodBody"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-orders" class="hide">
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h3>📋 店铺订单</h3>
        <select id="orderFilter" onchange="loadOrders()">
          <option value="">全部状态</option>
          <option>待发货</option><option>已发货</option><option>配送中</option><option>已送达</option><option>已取消</option>
        </select>
      </div>
      <table>
        <thead><tr><th>订单号</th><th>买家</th><th>商品</th><th>金额</th><th>支付</th><th>状态</th><th>收货信息</th><th>操作</th></tr></thead>
        <tbody id="orderBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const API = '../api/';
let TOKEN = localStorage.getItem('mk_token') || '';
let ME = null;

function api(path, data = {}) {
  const headers = {};
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  return fetch(API + path, { method: 'POST', headers, body: new URLSearchParams(data) }).then(r => r.json());
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer); t._timer = setTimeout(() => t.style.display = 'none', 2200);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showLogin() { document.getElementById('loginView').classList.remove('hide'); document.getElementById('regView').classList.add('hide'); }
function showReg() { document.getElementById('loginView').classList.add('hide'); document.getElementById('regView').classList.remove('hide'); }
async function login() {
  const r = await api('merchant_login.php', { username: document.getElementById('lgUser').value, password: document.getElementById('lgPwd').value });
  if (r.code === 1) { TOKEN = r.token; localStorage.setItem('mk_token', TOKEN); ME = r.user; enterApp(); }
  else toast(r.msg);
}
async function doReg() {
  const r = await api('register_merchant.php', { username: document.getElementById('rgUser').value,
    password: document.getElementById('rgPwd').value, shop_name: document.getElementById('rgShop').value,
    phone: document.getElementById('rgPhone').value });
  if (r.code === 1) { toast('注册成功，请登录'); showLogin(); } else toast(r.msg);
}
function logout() {
  api('logout.php').then(() => {});
  localStorage.removeItem('mk_token'); TOKEN = ''; ME = null;
  document.getElementById('mainView').classList.add('hide');
  document.getElementById('navBar').classList.add('hide');
  document.getElementById('loginView').classList.remove('hide');
}
function enterApp() {
  document.getElementById('loginView').classList.add('hide');
  document.getElementById('regView').classList.add('hide');
  document.getElementById('navBar').classList.remove('hide');
  document.getElementById('mainView').classList.remove('hide');
  document.getElementById('userBar').innerHTML = '🏪 ' + esc(ME.shop_name) + ' <button class="btn btn-sm" style="margin-left:10px;background:rgba(255,255,255,.25)" onclick="logout()">退出</button>';
  switchTab('products');
}
function switchTab(tab) {
  document.querySelectorAll('#navBar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-products').classList.toggle('hide', tab !== 'products');
  document.getElementById('tab-orders').classList.toggle('hide', tab !== 'orders');
  if (tab === 'products') loadProducts();
  if (tab === 'orders') loadOrders();
}

async function addProduct() {
  const r = await api('add_product.php', { name: document.getElementById('pName').value,
    price: document.getElementById('pPrice').value, stock: document.getElementById('pStock').value,
    img: document.getElementById('pImg').value, description: document.getElementById('pDesc').value });
  if (r.code === 1) { toast('上架成功'); ['pName','pPrice','pImg','pDesc'].forEach(i => document.getElementById(i).value = ''); loadProducts(); }
  else toast(r.msg);
}
async function loadProducts() {
  const r = await api('get_merchant_products.php', { page: 1, size: 100 });
  if (r.code !== 1) return toast(r.msg);
  document.getElementById('prodBody').innerHTML = r.list.length ? r.list.map(p => `
    <tr>
      <td>${p.id}</td><td>${esc(p.name)}</td><td>¥${p.price}</td>
      <td><input type="number" min="0" value="${p.stock}" style="width:70px" onchange="updProduct(${p.id},{stock:this.value})"></td>
      <td>${p.status === 1 ? '<span class="tag tag-green">上架</span>' : '<span class="tag tag-gray">下架</span>'}</td>
      <td class="row">
        <button class="btn btn-primary btn-sm" onclick="editProduct(${p.id})">改价/改名</button>
        <button class="btn btn-ghost btn-sm" onclick="updProduct(${p.id},{status:${p.status === 1 ? 0 : 1}})">${p.status === 1 ? '下架' : '上架'}</button>
        <button class="btn btn-danger btn-sm" onclick="delProduct(${p.id})">删除</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="6" class="empty">暂无商品，先上架一个吧</td></tr>';
}
function editProduct(pid) {
  const name = prompt('输入新名称（取消则保持不变）：', '');
  const price = prompt('输入新价格(元)（取消则保持不变）：', '');
  const data = {};
  if (name) data.name = name;
  if (price) data.price = price;
  if (!Object.keys(data).length) return;
  updProduct(pid, data);
}
async function updProduct(pid, data) {
  const r = await api('update_product.php', Object.assign({ product_id: pid }, data));
  toast(r.msg); loadProducts();
}
async function delProduct(pid) {
  if (!confirm('确认删除该商品（将下架）？')) return;
  const r = await api('delete_product.php', { product_id: pid });
  toast(r.msg); loadProducts();
}

async function loadOrders() {
  const r = await api('get_merchant_orders.php', { page: 1, size: 50, status: document.getElementById('orderFilter').value });
  if (r.code !== 1) return toast(r.msg);
  const stTag = { '待发货':'tag-orange', '已发货':'tag-orange', '配送中':'tag-green', '已送达':'tag-green', '已取消':'tag-gray' };
  document.getElementById('orderBody').innerHTML = r.list.length ? r.list.map(o => `
    <tr>
      <td>${esc(o.order_no)}</td><td>${esc(o.buyer)}</td><td>${esc(o.goods_text)}</td><td>¥${o.total_price}</td>
      <td>${o.pay_status === '已支付' ? '<span class="tag tag-green">已支付</span>' : '<span class="tag tag-red">未支付</span>'}</td>
      <td><span class="tag ${stTag[o.status] || 'tag-gray'}">${o.status}</span></td>
      <td style="font-size:12px;color:#666">${esc(o.rece_name)} ${esc(o.rece_phone)}<br>${esc(o.rece_addr)}</td>
      <td>${o.status === '待发货' ? `<button class="btn btn-primary btn-sm" onclick="ship(${o.id})">发货</button>` : ''}</td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty">暂无订单</td></tr>';
}
async function ship(oid) {
  const r = await api('ship_order.php', { order_id: oid });
  toast(r.msg); loadOrders();
}
</script>

<!-- 导航栏点击绑定（修复：navBar 按钮原本没有绑定 switchTab） -->
<script>
(function () {
  function bind() {
    document.querySelectorAll('#navBar button').forEach(function (b) {
      if (b.dataset.bound) return;
      b.dataset.bound = '1';
      b.addEventListener('click', function () { if (window.switchTab) switchTab(b.dataset.tab); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();
</script>
</body>
</html>
