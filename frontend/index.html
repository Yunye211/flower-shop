<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲜花商城外卖系统 v2 —— 本地入口</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: linear-gradient(135deg, #fdf2f8 0%, #eef2ff 100%); color: #1f2937;
  }
  .card { width: min(680px, 92vw); background: #fff; border-radius: 18px; padding: 36px 32px;
          box-shadow: 0 18px 50px rgba(79, 70, 229, .14); }
  h1 { margin: 0 0 6px; font-size: 24px; }
  .sub { color: #6b7280; font-size: 14px; margin-bottom: 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  a.role { display: block; padding: 18px 16px; border-radius: 12px; text-decoration: none;
           color: #fff; font-weight: 600; text-align: center; transition: transform .15s ease, box-shadow .15s ease; }
  a.role:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,.16); }
  .user { background: linear-gradient(135deg,#f472b6,#db2777); }
  .merchant { background: linear-gradient(135deg,#60a5fa,#2563eb); }
  .courier { background: linear-gradient(135deg,#34d399,#059669); }
  .admin { background: linear-gradient(135deg,#a78bfa,#7c3aed); }
  .tip { margin-top: 26px; padding: 14px 16px; background: #f9fafb; border: 1px solid #e5e7eb;
         border-radius: 10px; font-size: 13px; color: #4b5563; line-height: 1.7; }
  code { background: #eef2ff; color: #4338ca; padding: 1px 6px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🌷 鲜花商城外卖系统 v2</h1>
    <div class="sub">本地运行 · PHP 8.1 + Apache（phpStudy）· 数据库 Supabase PostgreSQL</div>

    <div class="grid">
      <a class="role user"     href="/user/">用户端</a>
      <a class="role merchant" href="/merchant/">商家端</a>
      <a class="role courier"  href="/courier/">外卖员端</a>
      <a class="role admin"    href="/admin/">管理端</a>
    </div>

    <div class="tip">
      接口地址：<code>/api/xxx.php</code> → 实际文件 <code>backend/api/xxx.php</code><br>
      数据库连接失败时，先检查 <code>backend/config.php</code> 的环境变量（DB_HOST / DB_PASS 等）。<br>
      首次使用请先访问一次 <a href="/api/seed.php">/api/seed.php</a> 初始化演示数据。
    </div>
  </div>
</body>
</html>
